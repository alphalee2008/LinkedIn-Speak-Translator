name = "linkedin-speak-translator"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "linkedin-translator-db"
database_id = "YOUR_D1_DATABASE_ID"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# Secrets (set via: wrangler secret put SECRET_NAME)
# OPENAI_API_KEY
# RESEND_API_KEY
# JWT_SECRET
